<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ResumeCraft CTA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px;
      height: 1080px;
      background-color: #090B10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      color: #FFFFFF;
    }
    /* Subtle glowing radial background */
    .glow {
      position: absolute;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(75, 61, 245, 0.22) 0%, rgba(9, 11, 16, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .logo-badge {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #4B3DF5 0%, #3B2DE6 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 36px rgba(75, 61, 245, 0.4);
    }
    .logo-icon svg {
      width: 36px;
      height: 36px;
      fill: #FFFFFF;
    }
    .wordmark {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -1.5px;
      color: #FFFFFF;
    }
    .tagline {
      font-size: 38px;
      font-weight: 600;
      color: #E1E5EA;
      margin-bottom: 48px;
      letter-spacing: -0.5px;
      max-width: 800px;
      line-height: 1.3;
    }
    .search-pill {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 9999px;
      padding: 16px 36px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .search-icon {
      width: 24px;
      height: 24px;
      stroke: #4B3DF5;
      stroke-width: 2.5;
      fill: none;
    }
    .search-text {
      font-size: 22px;
      font-weight: 500;
      color: #94A3B8;
    }
    .search-term {
      color: #FFFFFF;
      font-weight: 700;
    }
    .footer-note {
      position: absolute;
      bottom: 40px;
      font-size: 15px;
      color: #64748B;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="container">
    <div class="logo-badge">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8" fill="none" stroke="#FFFFFF" stroke-width="2"></polyline>
          <line x1="16" y1="13" x2="8" y2="13" stroke="#FFFFFF" stroke-width="2"></line>
          <line x1="16" y1="17" x2="8" y2="17" stroke="#FFFFFF" stroke-width="2"></line>
          <polyline points="10 9 9 9 8 9" stroke="#FFFFFF" stroke-width="2"></polyline>
        </svg>
      </div>
      <span class="wordmark">ResumeCraft</span>
    </div>
    <div class="tagline">Build a resume that actually gets read.</div>
    <div class="search-pill">
      <svg class="search-icon" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <div class="search-text">Search <span class="search-term">ResumeCraft</span></div>
    </div>
  </div>
  <div class="footer-note">ATS-Optimized &bull; Vector Typography &bull; Real PDF Export</div>
</body>
</html>
